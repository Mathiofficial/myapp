trigger:
- main

# ==================================================
# STAGE 1 - TEST
# ==================================================

stages:

- stage: Test
  displayName: "Test Application"

  jobs:
  - job: RunTests
    displayName: "Run Automated Tests"

    pool:
      vmImage: ubuntu-latest

    steps:

    - script: |
        echo "Running application tests..."

        chmod +x test.sh

        ./test.sh
      displayName: "Run Automated Tests"


# ==================================================
# STAGE 2 - BUILD
# ==================================================

- stage: Build
  displayName: "Build Application"

  dependsOn: Test

  jobs:
  - job: BuildApplication
    displayName: "Build and Package Application"

    pool:
      vmImage: ubuntu-latest

    steps:

    - script: |
        echo "Building application..."

        mkdir -p build

        cp index.html build/index.html

        echo "Build completed successfully"

        ls -la build
      displayName: "Build Application"


    - task: ArchiveFiles@2
      displayName: "Create Build Artifact"

      inputs:
        rootFolderOrFile: 'build'
        includeRootFolder: false
        archiveType: 'tar'
        tarCompression: 'gz'
        archiveFile: '$(Build.ArtifactStagingDirectory)/website-package.tar.gz'
        replaceExistingArchive: true


    - task: PublishPipelineArtifact@1
      displayName: "Publish Build Artifact"

      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/website-package.tar.gz'
        artifact: 'website-package'


# ==================================================
# STAGE 3 - DEPLOY
# ==================================================

- stage: Deploy
  displayName: "Deploy to Azure VM"

  dependsOn: Build

  condition: succeeded()

  jobs:
  - job: DeployApplication
    displayName: "Deploy Application"

    pool:
      vmImage: ubuntu-latest

    steps:

    - task: DownloadPipelineArtifact@2
      displayName: "Download Build Artifact"

      inputs:
        buildType: 'current'
        artifactName: 'website-package'
        targetPath: '$(Pipeline.Workspace)/website-package'


    - task: CopyFilesOverSSH@0
      displayName: "Copy Artifact to Azure VM"

      inputs:
        sshEndpoint: 'azure-vm-ssh'
        sourceFolder: '$(Pipeline.Workspace)/website-package'
        contents: 'website-package.tar.gz'
        targetFolder: '/tmp/azure-cicd-deploy'
        overwrite: true


    - task: SSH@0
      displayName: "Deploy Application to Azure VM"

      inputs:
        sshEndpoint: 'azure-vm-ssh'
        runOptions: 'commands'

        commands: |
          echo "Connected to Azure VM"
          echo "Deploying build artifact..."

          sudo mkdir -p /tmp/azure-cicd-deploy/extracted

          sudo rm -rf /tmp/azure-cicd-deploy/extracted/*

          sudo tar -xzf /tmp/azure-cicd-deploy/website-package.tar.gz -C /tmp/azure-cicd-deploy/extracted

          sudo cp /tmp/azure-cicd-deploy/extracted/index.html /var/www/html/index.html

          sudo systemctl restart nginx

          echo "Deployment completed successfully"

          sudo systemctl is-active nginx