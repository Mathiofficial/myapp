trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- script: |
    echo "Running application tests..."
    chmod +x test.sh
    ./test.sh
  displayName: "Run Automated Tests"

- task: CopyFilesOverSSH@0
  displayName: "Copy application to Azure VM"
  inputs:
    sshEndpoint: 'azure-vm-ssh'
    sourceFolder: '$(Build.SourcesDirectory)'
    contents: 'index.html'
    targetFolder: '/tmp/azure-cicd-deploy'
    overwrite: true

- task: SSH@0
  displayName: "Deploy application to Azure VM"
  inputs:
    sshEndpoint: 'azure-vm-ssh'
    runOptions: 'commands'
    commands: |
      echo "Connected to Azure VM"
      echo "Deploying application..."
      sudo cp /tmp/azure-cicd-deploy/index.html /var/www/html/index.html
      sudo systemctl restart nginx
      echo "Deployment completed successfully"
      sudo systemctl is-active nginx